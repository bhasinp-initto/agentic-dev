schema_version: "0.1"
project:
  name: example-host-project
  primary_language: python
commands:
  test: pytest -q
  lint: ruff check .
  typecheck: mypy .
  build: null
budgets:
  wall_clock_minutes_per_goal: 90
  diff_lines_per_goal: 800
  files_touched_per_goal: 25
sensitive_paths:
  - "auth/**"
  - "migrations/**"
  - "schema/**"
  - "secrets/**"
  - "payments/**"
  - "infra/**"
telegram: null
push_policy: hold
